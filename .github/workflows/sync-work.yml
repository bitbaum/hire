# The "Live work" list is derived from the fleet register, not typed.
#
# Typed, it drifted: on 2026-09-12 it linked a host retired two days earlier,
# counted one system twice under two names, and used two product names that had
# been replaced. Nothing broke — a retired host answers 200 because it is a
# permanent redirect — so nothing reported it, on the page a prospect reads
# first.
#
# GitHub Pages serves this repository directly, so committing the regenerated
# index.html IS the deploy.
name: Sync work list

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. A product's host changes on the timescale of a rename, not a
    # commit; daily would be noise, and noise gets muted.
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-work-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # On a PR the generator must not rewrite anything — it only reports that
      # the committed page still matches the register. A PR that edits the
      # generated block by hand fails here rather than landing silently.
      - name: The page still matches the register
        if: github.event_name == 'pull_request'
        run: node build.mjs --check

      - name: Regenerate, and commit only if the register moved
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          node build.mjs
          # Gate on the PAGE, not the snapshot. The snapshot carries the
          # register's `generatedAt`, which moves on every fetch — so gating on
          # it committed on every run and said nothing. That is not theoretical:
          # the first scheduled run after this workflow shipped pushed a commit
          # whose entire diff was one timestamp line.
          if git diff --quiet -- index.html; then
            echo "work list already current (register timestamp ignored)"
            git checkout -- register.snapshot.json
            exit 0
          fi
          git config user.name  "hire-bot"
          git config user.email "noreply@bitbaum.invalid"
          git add index.html register.snapshot.json
          git commit -m "chore(work): sync the live-work list with the fleet register"
          git push
