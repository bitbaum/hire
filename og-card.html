<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Mirrors the hire page's own tokens: white canvas, near-black text, the
     single #e63946 accent, a mono eyebrow at .14em tracking and a tight
     display face. A share card that looks like a different product is a worse
     card than none.

     The 1200x630 frame is exact and unforgiving, and the footer sits near the
     bottom edge: any change to the vertical budget clips it SILENTLY. Two
     attempts proved that — dropping the original border-bottom as "dead CSS"
     cut the footer in half (with border-box it had been reserving those 10px),
     and restructuring into main{flex:1} pushed the footer off the canvas
     entirely. Re-render and LOOK after editing this file; the source diff will
     not tell you. */
  :root{
    --canvas:#ffffff; --text:#0a0a0a; --muted:#707070;
    --border:#e2e2e2; --accent:#e63946;
    --mono: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, "DejaVu Sans", Helvetica, Arial, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    background:var(--canvas); color:var(--text); font-family:var(--sans);
    /* 88px bottom, not 78: it absorbs the 10px the removed border reserved. */
    padding:78px 84px 88px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .eyebrow{
    font-family:var(--mono); font-size:21px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted);
  }
  h1{ font-size:92px; line-height:1.02; letter-spacing:-0.032em; font-weight:700; margin:26px 0 0 }
  .rule{width:104px;height:5px;background:var(--accent);margin:34px 0 30px}
  p{font-size:35px; line-height:1.34; max-width:26ch}
  footer{
    display:flex; justify-content:space-between; align-items:baseline;
    border-top:1px solid var(--border); padding-top:26px;
    font-family:var(--mono); font-size:23px; color:var(--muted);
  }
  footer b{color:var(--text); font-weight:600}
</style>
</head>
<body>
  <div>
    <div class="eyebrow">Fractional CTO · Zürich</div>
    <h1>Georgy Butaev</h1>
    <div class="rule"></div>
    <p>I design and run production software alone, at the throughput of a small team.</p>
  </div>
  <footer>
    <span><b>14 production systems</b>, live</span>
    <span>bitbaum.github.io/hire</span>
  </footer>
</body>
</html>
